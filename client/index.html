<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>doodlydoo</title>
  </head>
  <body>
    <!-- Brush-texture filters for the wordmark (see components/Brand.tsx / index.css .brand-word) -
         defined once here rather than per-component so multiple Brand instances never collide on
         SVG filter ids. Two variants: "hero" for large auth-page sizes, "compact" for small navbar
         sizes. Both are edge-roughness-only (turbulence + displacement, no separate patchiness
         pass) - an earlier version added a second turbulence layer thresholded into a patchy alpha
         mask to fake dry-brush gaps, but at these letterform sizes it just as often isolated a
         stray fragment of a glyph's edge into a floating speck AND washed out the overall color -
         both real defects, not stylistic choices. Plain edge roughness reads as a rough brush
         stroke without either problem. -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <filter id="brush-hero" x="-10%" y="-20%" width="120%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="1.0" numOctaves="2" seed="5" result="n" />
          <feDisplacementMap in="SourceGraphic" in2="n" scale="1.1" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="brush-compact" x="-10%" y="-20%" width="120%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="2" seed="5" result="n" />
          <feDisplacementMap in="SourceGraphic" in2="n" scale="0.6" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
